<script type="module">

const P=new URLSearchParams(location.search);

 if(u.endsWith('.fbx'))return await new FBXLoader().loadAsync(u);

 const fn=new THREE.Vector3(),a=new THREE.Vector3(),b=new THREE.Vector3(),c=new THREE.Vector3();const F=idx?idx.count/3:p.count/3;const vi=k=>idx?idx.getX(k):k;
 for(let f=0;f<F;f++){const i0=vi(3*f),i1=vi(3*f+1),i2=vi(3*f+2);a.fromBufferAttribute(p,i0);b.fromBufferAttribute(p,i1);c.fromBufferAttribute(p,i2);fn.subVectors(c,b).cross(a.clone().sub(b));for(const i of [i0,i1,i2]){const k=key(i);const v=acc.get(k)||[0,0,0];v[0]+=fn.x;v[1]+=fn.y;v[2]+=fn.z;acc.set(k,v);}}
 for(let i=0;i<p.count;i++){const v=acc.get(key(i));if(v){const l=Math.hypot(...v)||1;n.setXYZ(i,v[0]/l,v[1]/l,v[2]/l);}}n.needsUpdate=true;}}if(o.isBone)bones.push(o);});

const B=n=>bones.find(b=>b.name.endsWith(n));

// bbox incl skinning

obj.traverse(o=>{if(o.isSkinnedMesh){o.skeleton.update();const p=o.geometry.attributes.position;for(let i=0;i<p.count;i+=7){o.getVertexPosition(i,v);v.applyMatrix4(o.matrixWorld);box.expandByPoint(v);}}else if(o.isMesh){box.expandByObject(o);}});

const d=m*2.9*(+P.get('zoom')||1);

cam.position.set(Math.sin(az)*Math.cos(el)*d,s.y/2+Math.sin(el)*d,Math.cos(az)*Math.cos(el)*d);cam.lookAt(tgt);
